<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>سورة النبأ</title>

  <!-- Mushaf-стиль: KFGQPC Hafs (Web adaptation) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New&display=swap" rel="stylesheet">

  <style>
    /* ====== ФОН (приглушённый, глубокий, с текстурой) ====== */
    body {
      margin: 0;
      padding: 0;
      background: #0c0d10;
      font-family: 'Scheherazade New', serif;
      color: #f5f2e8;
      position: relative;
    }

    /* Лёгкий шум поверх фона */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200'%3e%3crect width='200' height='200' fill='%230c0d10'/%3e%3ccircle cx='10' cy='10' r='1' fill='rgba(255,255,255,0.02)'/%3e%3ccircle cx='50' cy='80' r='1' fill='rgba(255,255,255,0.015)'/%3e%3ccircle cx='120' cy='40' r='1' fill='rgba(255,255,255,0.02)'/%3e%3ccircle cx='180' cy='150' r='1' fill='rgba(255,255,255,0.02)'/%3e%3c/svg%3e");
      opacity: 0.5;
    }

    .screen {
      max-width: 430px;
      margin: 0 auto;
      padding: 18px 14px 32px;
      position: relative;
      z-index: 2;
    }

    /* ====== Верхняя панель ====== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #b7b9c5;
      margin-bottom: 22px;
      direction: ltr;
    }

    /* ====== Заголовок суры ====== */
    .surah-header-inner {
      background: #1b1c20;
      border: 1px solid #8c744b;
      border-radius: 18px;
      padding: 14px 40px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 12px 20px rgba(0,0,0,0.55);
      margin-bottom: 26px;
    }

    .surah-title {
      text-align: center;
      font-size: 22px;
      color: #fff7db;
    }

    /* ====== Карточка с текстом ====== */
    .card {
      background: #1b1c20; /* тот же серый */
      border-radius: 22px;
      padding: 22px 20px 30px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 20px 35px rgba(0,0,0,0.7);
    }

    /* ====== Басмала — растянута, как в приложении ====== */
    .bismillah {
      text-align: center;
      font-size: 26px;
      margin-bottom: 10px;
      color: #f3e8cc;
      transform: scaleX(1.55); /* << растянуто как в UI */
      display: inline-block;
      opacity: 0.95;
    }

    /* ====== Аяты ====== */
    .ayahs {
      direction: rtl;
      text-align: justify;
      font-size: 26px;
      line-height: 2.1;      /* плотные строки */
      word-spacing: 0px;     /* слова близко друг к другу */
      letter-spacing: 0px;   /* никаких лишних пробелов */
    }

    .ayah {
      display: inline;
    }

    /* ====== Номер аята ====== */
    .ayah-num {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      color: #e8dcc0;

      margin-left: 1px;
      margin-right: 1px;

      background: #4d3e25;
      border: 1px solid #bfa06a;

      box-shadow:
        inset 0 0 3px rgba(255,255,255,0.06),
        0 0 3px rgba(0,0,0,0.4);
    }

    /* ====== Нижняя панель ====== */
    .bottom-bar {
      margin-top: 18px;
      color: #b2b4c3;
      font-size: 13px;
      direction: ltr;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .bookmark-icon {
      width: 16px;
      height: 18px;
      border: 1px solid #b0b2c4;
      border-radius: 3px;
    }

    .loader, .error {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .loader { color: #b0b2c4; }
    .error { color: #ffb2b2; }

  </style>
</head>
<body>
  <div class="screen">

    <div class="top-bar">
      <span>Ан-Наба</span>
      <span>джуз 30</span>
    </div>

    <div class="surah-header-inner">
      <div class="surah-title">سورة النبأ</div>
    </div>

    <div class="card">
      <div class="bismillah">﷽</div>

      <div id="ayahs" class="ayahs"></div>
      <div id="loader" class="loader">Загрузка аятов...</div>
      <div id="error" class="error" style="display:none;"></div>
    </div>

    <div class="bottom-bar">
      <div class="bookmark-icon"></div>
      <span>582</span>
    </div>

  </div>

  <script>
    const SURAH_NUMBER = 78;

    function toArabicIndic(num) {
      return String(num).replace(/[0-9]/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
    }

    async function loadSurah() {
      const ayahsEl = document.getElementById('ayahs');
      const loaderEl = document.getElementById('loader');
      const errorEl = document.getElementById('error');

      try {
        const url = `https://api.quran.com/api/v4/quran/verses/uthmani?chapter_number=${SURAH_NUMBER}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('API error ' + res.status);

        const data = await res.json();
        loaderEl.style.display = 'none';

        data.verses.forEach((v, index) => {
          const ayahElement = document.createElement('span');
          ayahElement.className = 'ayah';

          ayahElement.innerHTML =
            v.text_uthmani +
            ` <span class="ayah-num">${toArabicIndic(index + 1)}</span> `;

          ayahsEl.appendChild(ayahElement);
        });

      } catch (err) {
        loaderEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.textContent = 'Ошибка загрузки аятов.';
      }
    }

    loadSurah();
  </script>

</body>
</html>
