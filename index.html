<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>سورة النبأ</title>

  <!-- Mushaf-style шрифт -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: #0f1012; /* Фон стал более серым */
      font-family: 'Scheherazade New', serif;
      color: #f5f2e8;
    }

    .screen {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 18px 14px 32px;
    }

    /* Верхняя панель */
    .top-bar {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #b8bac8;
      margin-bottom: 22px;
      direction: ltr;
    }

    /* Заголовок суры */
    .surah-header-inner {
      position: relative;
      border-radius: 18px;
      padding: 14px 40px;
      background: #1a1b1f;
      border: 1px solid #8b744b;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 10px 20px rgba(0,0,0,0.55);
      margin-bottom: 26px;
    }

    .surah-title {
      text-align: center;
      font-size: 22px;
      color: #fff7db;
    }

    /* Карточка с сурой — теперь тоже серая */
    .card {
      background: #1a1b1f; /* <-- тот же оттенок, что и заголовок */
      border-radius: 22px;
      padding: 24px 20px 30px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 20px 35px rgba(0,0,0,0.7);
    }

    .bismillah {
      text-align: center;
      font-size: 24px;
      margin-bottom: 18px;
      color: #f3e8cc;
    }

    /* Аяты */
    .ayahs {
      direction: rtl;
      text-align: justify;
      font-size: 26px;
      line-height: 2.4;
      letter-spacing: 0.05px;
    }

    .ayah {
      display: inline;
      white-space: normal;
    }

    /* Номер аята — уменьшенный интервал и корректный вид */
    .ayah-num {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      margin-left: 2px;  /* <-- стало ближе */
      margin-right: 2px;
      font-size: 11px;
      font-weight: 700;
      color: #e8dcc0;

      background: #5a4a2d;
      border: 1px solid #bfa06a;

      box-shadow:
        0 0 3px rgba(0,0,0,0.35),
        inset 0 0 3px rgba(255,255,255,0.06);
    }

    .bottom-bar {
      margin-top: 18px;
      color: #b2b4c3;
      font-size: 13px;
      direction: ltr;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bookmark-icon {
      width: 16px;
      height: 18px;
      border: 1px solid #b0b2c4;
      border-radius: 3px;
    }

    .loader, .error {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .loader { color: #b0b2c4; }
    .error { color: #ffb2b2; }

  </style>
</head>
<body>
  <div class="screen">

    <div class="top-bar">
      <span>Ан-Наба</span>
      <span>джуз 30</span>
    </div>

    <div class="surah-header-inner">
      <div class="surah-title">سورة النبأ</div>
    </div>

    <div class="card">
      <div class="bismillah">﷽</div>

      <div id="ayahs" class="ayahs"></div>
      <div id="loader" class="loader">Загрузка аятов...</div>
      <div id="error" class="error" style="display:none;"></div>
    </div>

    <div class="bottom-bar">
      <div class="bookmark-icon"></div>
      <span>582</span>
    </div>
  </div>

  <script>
    const SURAH_NUMBER = 78;

    function toArabicIndic(num) {
      return String(num).replace(/[0-9]/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
    }

    async function loadSurah() {
      const ayahsEl = document.getElementById('ayahs');
      const loaderEl = document.getElementById('loader');
      const errorEl = document.getElementById('error');

      try {
        const url =
          `https://api.quran.com/api/v4/quran/verses/uthmani?chapter_number=${SURAH_NUMBER}`;

        const res = await fetch(url);
        if (!res.ok) throw new Error('Ошибка API: ' + res.status);

        const data = await res.json();
        const verses = data.verses || [];

        loaderEl.style.display = 'none';

        verses.forEach((v, idx) => {
          const spanAyah = document.createElement('span');
          spanAyah.className = 'ayah';

          spanAyah.innerHTML =
            v.text_uthmani +
            ` <span class="ayah-num">${toArabicIndic(idx + 1)}</span> `;

          ayahsEl.appendChild(spanAyah);
        });

      } catch (e) {
        loaderEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.textContent = 'Не удалось загрузить аяты.';
        console.error(e);
      }
    }

    loadSurah();
  </script>

</body>
</html>
