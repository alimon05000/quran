<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">

<style>
body {
  background: #050508;
  color: #f7f7f7;
  font-family: 'Amiri', serif;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 520px;
  margin: auto;
  font-size: 26px;
  line-height: 2.3;
  text-align: justify;
}

.ayah {
  display: inline; /* ключевой момент */
  position: relative;
  padding-left: 34px; /* место под номер */
}

.num {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  width: 26px;
  height: 26px;
  font-size: 12px;
  border-radius: 50%;
  border: 1px solid #cba96c;
  color: #f0e1bf;
  background: radial-gradient(circle at 30% 20%, #f8f0d2, #8d6a3e);
  margin: 0 4px 0 0;
}
</style>
</head>
<body>

<div class="container">

  <span class="ayah">
    عَمَّ يَتَسَاءَلُونَ <span class="num">١</span>
  </span>

  <span class="ayah">
    عَنِ النَّبَإِ الْعَظِيمِ <span class="num">٢</span>
  </span>

  <span class="ayah">
    الَّذِي هُمْ فِيهِ مُخْتَلِفُونَ <span class="num">٣</span>
  </span>

  <span class="ayah">
    كَلَّا سَيَعْلَمُونَ <span class="num">٤</span>
  </span>

  <span class="ayah">
    ثُمَّ كَلَّا سَيَعْلَمُونَ <span class="num">٥</span>
  </span>

</div>

</body>
</html>
