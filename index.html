<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>سورة النبأ</title>

  <!-- Шрифт (можно заменить на свой) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #050507;
      font-family: 'Amiri', system-ui, serif;
      color: #f9f6ec;
    }

    .screen {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 18px 14px 32px;
      position: relative;
    }

    /* Верхняя строка: название суры и джуз */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      direction: ltr;
      font-size: 13px;
      color: #a7a9c2;
      margin-bottom: 22px;
    }

    .top-bar span {
      opacity: 0.95;
    }

    /* Заголовок суры с декоративной рамкой */
    .surah-header {
      position: relative;
      margin-bottom: 26px;
    }

    .surah-header-inner {
      position: relative;
      border-radius: 18px;
      padding: 14px 40px;
      border: 1px solid #8b7348;
      background:
        radial-gradient(circle at 0 50%, #caa96e 0, #caa96e 8px, transparent 9px),
        radial-gradient(circle at 100% 50%, #caa96e 0, #caa96e 8px, transparent 9px),
        linear-gradient(90deg, #2b2420 0%, #15110e 15%, #15110e 85%, #2b2420 100%);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.03),
        0 14px 24px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }

    .surah-header-inner::before,
    .surah-header-inner::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 70px;
      background-image:
        radial-gradient(circle at 15% 20%, #f8f0d1 0, #f8f0d1 12%, transparent 13%),
        radial-gradient(circle at 70% 70%, #f8f0d1 0, #f8f0d1 12%, transparent 13%),
        radial-gradient(circle at 50% 50%, #b4874b 0, #8b6031 30%, #3c2714 65%);
      background-repeat: no-repeat;
      background-position: 10px 10px, 40px 26px, center;
      opacity: 0.9;
    }

    .surah-header-inner::before {
      left: 0;
      border-top-right-radius: 50px;
      border-bottom-right-radius: 50px;
    }

    .surah-header-inner::after {
      right: 0;
      border-top-left-radius: 50px;
      border-bottom-left-radius: 50px;
      transform: scaleX(-1);
    }

    .surah-title {
      position: relative;
      text-align: center;
      font-size: 22px;
      color: #fff7dc;
      letter-spacing: 1px;
      z-index: 1;
    }

    /* Карточка с самой сурой */
    .card {
      margin-top: 6px;
      background: #050509;
      border-radius: 24px;
      padding: 22px 20px 26px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.03),
        0 24px 40px rgba(0, 0, 0, 0.9);
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at 50% 0, rgba(255, 255, 255, 0.03), transparent 60%);
      pointer-events: none;
    }

    .bismillah {
      text-align: center;
      font-size: 22px;
      margin-bottom: 14px;
      color: #f3e3bb;
    }

    /* Контейнер для аятов – поток справа налево */
    .ayahs {
      direction: rtl;
      text-align: justify;
      font-size: 22px;
      line-height: 2.3;
    }

    .ayah {
      display: inline;
      white-space: normal;
    }

    .ayah-num {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid #caa96e;
      margin: 0 4px;
      font-size: 12px;
      color: #f5e6c5;
      background:
        radial-gradient(circle at 30% 20%, #f8f0d2 0, #f8f0d2 35%, #8d6a3e 75%);
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.7);
    }

    .bottom-bar {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #b0b2c4;
      font-size: 13px;
      direction: ltr;
    }

    .bookmark-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid #b0b2c4;
      position: relative;
    }

    .bookmark-icon::before {
      content: "";
      position: absolute;
      inset: 3px 4px;
      border-radius: 2px 2px 0 0;
      border-bottom: 8px solid transparent;
      border-left: 7px solid #b0b2c4;
      border-right: 7px solid #b0b2c4;
    }

    /* Loader */
    .loader {
      text-align: center;
      font-size: 14px;
      color: #b0b2c4;
      margin-top: 20px;
    }

    .error {
      text-align: center;
      color: #ffb2b2;
      font-size: 14px;
      margin-top: 14px;
    }

    @media (max-width: 380px) {
      .screen {
        padding-inline: 10px;
      }
      .card {
        padding-inline: 16px;
      }
      .surah-header-inner {
        padding-inline: 34px;
      }
    }
  </style>
</head>
<body>
  <div class="screen">

    <!-- Верхняя панель -->
    <div class="top-bar">
      <span>Ан-Наба</span>
      <span>джуз 30</span>
    </div>

    <!-- Заголовок суры -->
    <div class="surah-header">
      <div class="surah-header-inner">
        <div class="surah-title">سورة النبأ</div>
      </div>
    </div>

    <!-- Карточка с текстом -->
    <div class="card">
      <div class="bismillah">﷽</div>

      <div id="ayahs" class="ayahs"></div>
      <div id="loader" class="loader">Загрузка аятов...</div>
      <div id="error" class="error" style="display:none;"></div>
    </div>

    <!-- Нижняя строка с номером страницы -->
    <div class="bottom-bar">
      <div class="bookmark-icon"></div>
      <span>582</span>
    </div>

  </div>

  <script>
    // Номер суры (Ан-Наба = 78)
    const SURAH_NUMBER = 78;

    // Преобразование цифр в арабские индийские (١٢٣...)
    function toArabicIndic(num) {
      return String(num).replace(/[0-9]/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
    }

    async function loadSurah() {
      const ayahsEl = document.getElementById('ayahs');
      const loaderEl = document.getElementById('loader');
      const errorEl = document.getElementById('error');

      try {
        // Quran.com API v4 – Uthmani script по суре
        const url = `https://api.quran.com/api/v4/quran/verses/uthmani?chapter_number=${SURAH_NUMBER}`;
        const res = await fetch(url);
        if (!res.ok) {
          throw new Error('Ошибка API: ' + res.status);
        }

        const data = await res.json();
        const verses = data.verses || [];

        loaderEl.style.display = 'none';
        ayahsEl.innerHTML = '';

        verses.forEach((v, idx) => {
          const spanAyah = document.createElement('span');
          spanAyah.className = 'ayah';

          const textNode = document.createTextNode(v.text_uthmani + ' ');
          const numSpan = document.createElement('span');
          numSpan.className = 'ayah-num';
          numSpan.textContent = toArabicIndic(idx + 1);

          spanAyah.appendChild(textNode);
          spanAyah.appendChild(numSpan);
          ayahsEl.appendChild(spanAyah);
          ayahsEl.appendChild(document.createTextNode(' '));
        });
      } catch (e) {
        loaderEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.textContent = 'Не удалось загрузить аяты. Проверьте подключение к интернету.';
        console.error(e);
      }
    }

    loadSurah();
  </script>
</body>
</html>
